      - name: Build combined.py with injected secrets
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import os
          import json
          import sys
          with open("veriscope.py", "r", encoding="utf-8") as f:
              original = f.read()
          wrapper = """
          import os
          import sys
          print("=" * 70, flush=True)
          print("[WRAPPER] A inicializar ambiente...", flush=True)
          _hf_token = {hf}
          _gh_pat = {github}
          _gh_repo = {repo}
          os.environ['HF_TOKEN'] = _hf_token
          os.environ['HF_TOKEN '] = _hf_token
          os.environ['GITHUB_PAT'] = _gh_pat
          os.environ['GITHUB_PAT '] = _gh_pat
          os.environ['GITHUB_REPOSITORY'] = _gh_repo
          os.environ['GITHUB_REPOSITORY '] = _gh_repo
          print("[WRAPPER] HF_TOKEN definido:", bool(os.environ.get('HF_TOKEN')), flush=True)
          print("[WRAPPER] HF_TOKEN length:", len(os.environ.get('HF_TOKEN', '')), flush=True)
          print("[WRAPPER] HF_TOKEN prefix:", os.environ.get('HF_TOKEN', '')[:8] + '...' if os.environ.get('HF_TOKEN') else 'VAZIO', flush=True)
          print("[WRAPPER] GITHUB_REPOSITORY:", os.environ.get('GITHUB_REPOSITORY'), flush=True)
          print("=" * 70, flush=True)
          sys.stdout.flush()
          """.format(
              hf=json.dumps(os.environ["HF_TOKEN"]),
              github=json.dumps(os.environ["GITHUB_PAT"]),
              repo=json.dumps(os.environ["GITHUB_REPO"])
          )
          with open("combined.py", "w", encoding="utf-8") as f:
              f.write(wrapper)
              f.write(original)
          print("[OK] combined.py criado com sucesso.")
          print("[OK] Tamanho do combined.py:", os.path.getsize("combined.py"), "bytes")
          PY
