name: colab-bench
on: workflow_dispatch

jobs:
  bench:
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: "1"
      COLAB_TOKEN_JSON: ${{ secrets.COLAB_TOKEN_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar Colab CLI
        run: pip install google-colab-cli

      - name: Credenciais
        run: |
          mkdir -p ~/.config/colab-cli
          echo "$COLAB_TOKEN_JSON" > ~/.config/colab-cli/auth.json

      - name: Benchmark no runner do GitHub (referência)
        run: python bench.py

      - name: Benchmark na VM do Colab
        run: |
          START=$(date +%s)
          colab run bench.py
          echo "Tempo total (provisionar+correr+destruir): $(( $(date +%s) - START ))s"
